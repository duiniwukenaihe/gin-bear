version: 2
project_name: gin-bear

builds:
  - id: bear
    main: ./cmd/bear
    binary: bear
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/duiniwukenaihe/gin-bear/pkg/bear.Version={{ .Version }} -X github.com/duiniwukenaihe/gin-bear/pkg/bear.Commit={{ .Commit }} -X github.com/duiniwukenaihe/gin-bear/pkg/bear.BuildTime={{ .Date }}

archives:
  - id: bear
    ids:
      - bear
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"
  format: tar.gz

changelog:
  use: git
  filters:
    exclude:
      - "^docs:"

release:
  github:
    owner: duiniwukenaihe
    name: gin-bear
  include_meta: true
