name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.12"
          cache: true

      - name: Install pinned release verification tools
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          CGO_ENABLED=0 GOBIN="${RUNNER_TEMP}/bin" go install -trimpath -ldflags=-buildid= golang.org/x/exp/cmd/apidiff@v0.0.0-20260709172345-9ea1abe57597
          GOBIN="${RUNNER_TEMP}/bin" go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          GOBIN="${RUNNER_TEMP}/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Verify release candidate gate
        env:
          APIDIFF_BIN: ${{ runner.temp }}/bin/apidiff
          APIDIFF_EXPECTED_SHA256: 84b7e058a4df23bc0e21d3eae07dedc0b93cee85b40ee8c65701944eed5f742f
          STATICCHECK_BIN: ${{ runner.temp }}/bin/staticcheck
          GOVULNCHECK_BIN: ${{ runner.temp }}/bin/govulncheck
          RC_ALLOW_NETWORK: "1"
          RC_ARTIFACT_DIR: ${{ runner.temp }}/rc-verification
          RC_BASE_REF: origin/main
          RC_RELEASE_TAG: ${{ github.ref_name }}
          RC_EXPECTED_VERSION: ${{ github.ref_name }}
          RC_VERIFY_TAG_SIGNATURE: "false"
        run: make verify-rc

      - name: Upload RC verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rc-verification
          path: ${{ runner.temp }}/rc-verification
          if-no-files-found: error

      - name: Publish CLI archives
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
