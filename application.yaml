server:
  port: 8080
  name: "gin-bear"
  shutdown_timeout: "5s"

health:
  readiness_timeout: "3s"

log:
  level: "info"

database:
  type: "postgres"  # mysql 或 postgres
  host: "localhost"
  port: "5432"
  user: "postgres"
  password: "your-password"
  dbname: "gin_bear"

redis:
  addr: "localhost:6379"
  required: false

tracing:
  enabled: false
  service_name: "gin-bear"
  exporter: "stdout"
  otlp_endpoint: "http://localhost:4318"
  sample_rate: 1.0

auth:
  jwt_secret: "bear-secret"
  token_expire_hours: 24
  public_paths:
    - "/health"
    - "/live"
    - "/ready"
    - "/version"
    - "/swagger/*"
