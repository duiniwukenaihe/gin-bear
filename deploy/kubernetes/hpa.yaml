apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gin-bear
  labels:
    app.kubernetes.io/name: gin-bear
    app.kubernetes.io/part-of: gin-bear
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gin-bear
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
