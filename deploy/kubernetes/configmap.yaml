apiVersion: v1
kind: ConfigMap
metadata:
  name: gin-bear-config
  labels:
    app.kubernetes.io/name: gin-bear
    app.kubernetes.io/part-of: gin-bear
data:
  application.yaml: |
    server:
      port: 8080
      name: "gin-bear"
      mode: "release"

    database:
      enabled: false

    auth:
      jwt_secret: "replace-with-kubernetes-secret"
      token_expire_hours: 24
      public_paths:
        - "/health"
        - "/live"
        - "/ready"
        - "/version"
        - "/metrics"
        - "/swagger/*"

    metrics:
      enabled: true
      path: "/metrics"

    tracing:
      enabled: false
      service_name: "gin-bear"
      exporter: "otlp"
      otlp_endpoint: "http://otel-collector:4318/v1/traces"
      sample_rate: 1.0
